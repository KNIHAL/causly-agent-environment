name: Bug report
description: Something on the landing page or docs site is broken
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Page URL
      description: Which page is affected?
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
